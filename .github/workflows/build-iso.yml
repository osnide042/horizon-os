name: Build Horizon OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["os/**", ".github/workflows/build-iso.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common gettext
          git clone --depth 1 https://salsa.debian.org/live-team/live-build.git /tmp/live-build-current
          sudo make -C /tmp/live-build-current install
          hash -r
          lb --version
      - name: Add account configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY secret" && exit 1)
          sed -i "s|__SUPABASE_URL__|$SUPABASE_URL|g" os/config/includes.chroot/opt/horizon/config.js
          sed -i "s|__SUPABASE_ANON_KEY__|$SUPABASE_ANON_KEY|g" os/config/includes.chroot/opt/horizon/config.js
      - name: Build bootable ISO
        working-directory: os
        run: |
          chmod +x auto/config config/hooks/live/*.hook.chroot
          sudo lb clean --purge || true
          sudo ./auto/config
          sudo lb build
          sudo mv live-image-amd64.hybrid.iso ../Horizon-OS-amd64.iso
          sudo chown "$USER:$USER" ../Horizon-OS-amd64.iso
          sha256sum ../Horizon-OS-amd64.iso > ../Horizon-OS-amd64.iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-OS-amd64
          path: |
            Horizon-OS-amd64.iso
            Horizon-OS-amd64.iso.sha256
          retention-days: 14
