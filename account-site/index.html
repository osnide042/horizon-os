<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horizon Account</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body><div class="glow one"></div><div class="glow two"></div><main><div class="brand"><span>H</span> HORIZON</div><section><p class="eyebrow">HORIZON NETWORK</p><h1>Create your player account.</h1><p class="lead">Use this account to finish setting up Horizon OS, sync your profile and connect with players.</p><form id="form"><label>Display name</label><input id="name" maxlength="24" required placeholder="Player name"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"><label>Password</label><input id="password" type="password" minlength="8" required placeholder="At least 8 characters"><button id="submit">CREATE ACCOUNT</button></form><p id="message"></p><button class="link" id="mode">Already registered? Sign in</button></section></main><script src="app.js"></script></body></html>
